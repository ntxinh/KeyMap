[package]
name = "keymap"
version = "0.1.0"
edition = "2021"

[dependencies]
relm4 = { version = "0.9", features = ["libadwaita", "gnome_47"] }
relm4-components = "0.9"
kdl = { version = "6", features = ["v1-fallback"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify-debouncer-full = "0.5"

[dev-dependencies]
tempfile = "3"
